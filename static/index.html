<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedef Kuyumculuk - Canlı Fiyatlar</title>

    <!-- WhatsApp, Instagram, Facebook için Link Paylaşım (Open Graph) Ayarları -->
    <meta property="og:title" content="Sedef Kuyumculuk | Canlı Altın ve Döviz Piyasası">
    <meta property="og:description" content="Fikirtepe Sedef Kuyumculuk - Anlık gram altın, çeyrek, yarım, tam, ata lira ve güncel döviz kurları alış/satış fiyatları.">
    <meta property="og:image" content="https://borsa.sedefkuyumculuk.com/vitrin/logo.png">
    <meta property="og:url" content="https://borsa.sedefkuyumculuk.com">
    <meta property="og:type" content="website">

    <!-- Twitter ve Diğer Platformlar için -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sedef Kuyumculuk | Canlı Altın ve Döviz Piyasası">
    <meta name="twitter:description" content="Fikirtepe Sedef Kuyumculuk - Anlık gram altın, çeyrek, yarım, tam, ata lira ve güncel döviz kurları.">
    <meta name="twitter:image" content="https://borsa.sedefkuyumculuk.com/vitrin/logo.png">

    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #141416;
            --row-bg: #1c1c1e;
            --text-light: #f5f5f5;
            --text-muted: #8e8e93;
            --gold: #d4af37;
            --gold-light: #e6c875;
            --anthracite: #8b8e91; 
            --anthracite-dark: #6c6f72; 
            --green: #34c759;
            --red: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px 8px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Üst Başlık, Logo ve Saat Alanı */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 8px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            color: var(--anthracite);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo-subtitle {
            color: var(--anthracite-dark);
            font-size: 11px;
            letter-spacing: 4px;
            margin-top: 2px;
        }

        .clock {
            color: var(--gold-light);
            font-size: 15px;
            font-family: monospace;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Ana Liste Kartı */
        .main-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #222;
        }

        .card-header-title {
            color: var(--gold);
            text-align: center;
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .table-titles {
            display: flex;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            padding: 0 10px;
            margin-bottom: 12px;
        }

        .col-urun { flex: 1.2; }
        .col-alis { flex: 1; text-align: center; }
        .col-satis { flex: 1; text-align: right; padding-right: 15px; }

        /* Liste Satırları (Kapsüller) */
        .row {
            background-color: var(--row-bg);
            border-radius: 25px;
            padding: 14px 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            transition: background-color 0.3s;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .urun-adi {
            flex: 1.2;
            color: var(--text-light);
            font-weight: 500;
            font-size: 13px;
            white-space: nowrap;
        }

        .fiyat-alis {
            flex: 1;
            text-align: center;
            color: var(--gold-light);
            font-family: monospace;
            font-size: 14px;
            white-space: nowrap;
        }

        .fiyat-satis {
            flex: 1;
            text-align: right;
            color: var(--text-light);
            font-family: monospace;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .tl-simge {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 2px;
        }

        .ok {
            font-size: 11px;
            width: 12px;
            text-align: center;
        }
        .ok.yukari { color: var(--green); }
        .ok.asagi { color: var(--red); }
        .ok.sabit { color: #555; }

        @keyframes flash {
            0% { background-color: rgba(212, 175, 55, 0.15); }
            100% { background-color: var(--row-bg); }
        }
        .guncellendi {
            animation: flash 0.6s ease-out;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="logo-container">
            <img src="logo.png" alt="Sedef Logo" class="brand-logo">
            <div class="brand-text">
                <div class="logo-title">SEDEF</div>
                <div class="logo-subtitle">KUYUMCULUK</div>
            </div>
        </div>
        <div class="clock" id="clock">--:--:--</div>
    </div>

    <div class="main-card">
        <div class="card-header-title">CANLI PİYASALAR</div>
        
        <div class="table-titles">
            <div class="col-urun">ÜRÜN</div>
            <div class="col-alis">ALIŞ</div>
            <div class="col-satis">SATIŞ</div>
        </div>

        <div id="fiyat-listesi">
            <!-- JS ile veriler buraya dolacak -->
        </div>
    </div>
</div>

<script>
    const gizliKalemler = ["24 AYAR", "22 AYAR"];
    let eskiFiyatlar = {};

    function formatiAyarla(sayi) {
        return parseFloat(sayi).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    setInterval(() => {
        const simdi = new Date();
        document.getElementById('clock').innerText = simdi.toLocaleTimeString('tr-TR');
    }, 1000);

    async function verileriCek() {
        try {
            const yanit = await fetch('/api/guncel-fiyatlar');
            const veri = await yanit.json();
            
            const listeDiv = document.getElementById('fiyat-listesi');
            const birlesikListe = { ...veri.kategoriler.ozet, ...veri.kategoriler.altin, ...veri.kategoriler.doviz };
            
            let htmlIcerik = '';

            for (const [isim, kurlar] of Object.entries(birlesikListe)) {
                if (gizliKalemler.includes(isim)) continue;

                let okHtml = '<span class="ok sabit">-</span>';
                let eskiSatis = eskiFiyatlar[isim]?.satis;

                if (eskiSatis) {
                    if (kurlar.satis > eskiSatis) {
                        okHtml = '<span class="ok yukari">▲</span>';
                        eskiFiyatlar[isim].yon = okHtml;
                    } else if (kurlar.satis < eskiSatis) {
                        okHtml = '<span class="ok asagi">▼</span>';
                        eskiFiyatlar[isim].yon = okHtml;
                    } else {
                        okHtml = eskiFiyatlar[isim].yon || okHtml;
                    }
                }

                let satirClass = 'row';
                if (eskiSatis && eskiSatis !== kurlar.satis) {
                    satirClass += ' guncellendi';
                }

                htmlIcerik += `
                    <div class="${satirClass}">
                        <div class="urun-adi">${isim}</div>
                        <div class="fiyat-alis">${formatiAyarla(kurlar.alis)} <span class="tl-simge">₺</span></div>
                        <div class="fiyat-satis">
                            ${formatiAyarla(kurlar.satis)} <span class="tl-simge">₺</span> ${okHtml}
                        </div>
                    </div>
                `;

                if (!eskiFiyatlar[isim]) eskiFiyatlar[isim] = {};
                eskiFiyatlar[isim].satis = kurlar.satis;
            }

            listeDiv.innerHTML = htmlIcerik;

        } catch (hata) {
            console.error("Fiyatlar güncellenemedi:", hata);
        }
    }

    verileriCek();
    setInterval(verileriCek, 2000);
</script>

</body>
</html>
